---
- name: Automate Nginx Installation
  hosts: webservers
  become: true

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Copy website
      ansible.builtin.copy:
        src: files/index.html
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Start Nginx service
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
